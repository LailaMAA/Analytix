<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnalytixCare | Connexion</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/pro_max.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        .login-card {
            width: 400px;
            padding: 3rem;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .input-group ion-icon {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-right: 10px;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-family: 'Outfit', sans-serif;
        }

        .btn-login {
            background: var(--electric-blue);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>

<body>

    <div class="glass login-card">
        <div style="text-align: center; margin-bottom: 1rem;">
            <div
                style="width: 60px; height: 60px; background: var(--vibrant-purple); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                <ion-icon name="car-sport" style="font-size: 2rem; color: white;"></ion-icon>
            </div>
            <h2 style="font-size: 1.8rem;">Bienvenue</h2>
            <p style="color: var(--text-muted);">Connectez-vous à AnalytixCare</p>
        </div>

        <!-- Dummy inputs to trick browser autofill -->
        <input type="text" style="display:none">
        <input type="password" style="display:none">

        <div class="input-group">
            <ion-icon name="mail-outline"></ion-icon>
            <input type="email" placeholder="Email professionnel" autocomplete="new-password" id="emailInput"
                name="fake_email_to_prevent_autofill">
        </div>

        <div class="input-group">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" placeholder="Mot de passe" autocomplete="new-password" id="pwdInput"
                name="fake_password_to_prevent_autofill">
        </div>

        <button class="btn-login" onclick="handleLogin()">Se Connecter</button>

        <p style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 1rem;">
            Problème de connexion ? <a href="#" style="color: var(--electric-blue); text-decoration: none;">Support
                IT</a>
        </p>

        <div
            style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); text-align: center;">
            <a href="/driver"
                style="display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; padding: 8px 16px; border-radius: 8px; background: rgba(255,255,255,0.05); transition: 0.3s;">
                <ion-icon name="speedometer-outline"></ion-icon>
                Accès Espace Conducteur
            </a>
        </div>
    </div>

    <script>
        // Security: Aggressively clear inputs to prevent cached credential display
        function clearInputs() {
            const email = document.getElementById('emailInput');
            const pwd = document.getElementById('pwdInput');
            if (email) email.value = '';
            if (pwd) pwd.value = '';
        }

        window.onload = function () {
            clearInputs();
            // Retry after small delay in case browser autofills after load
            setTimeout(clearInputs, 100);
            setTimeout(clearInputs, 500);
        }

        function handleLogin() {
            // Simulation
            const btn = document.querySelector('.btn-login');
            btn.textContent = 'Connexion...';
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 800);
        }
    </script>
</body>

</html>
